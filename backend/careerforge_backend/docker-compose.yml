version: "3.9"

services:
  db:
    image: postgres:17
    container_name: careerforge-db
    restart: unless-stopped

    env_file:
      - .env

    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .

    container_name: careerforge-backend

    working_dir: /app

    env_file:
      - .env

    command: >
      gunicorn careerforge_backend.wsgi:application
      --bind 0.0.0.0:8000
      --workers 3
      --threads 2
      --timeout 180

    volumes:
      - .:/app

    ports:
      - "8000:8000"

    restart: unless-stopped

    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ../../frontend/CareerForge_frontend

    container_name: careerforge-frontend

    ports:
      - "5174:5173"

    restart: unless-stopped

    depends_on:
      - backend

volumes:
  postgres_data: